<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time-Series Analytics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6fa; color: #222; }
  header { background: #1f3a5f; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  #stats { display: flex; gap: 16px; padding: 16px 24px 0; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 8px; padding: 10px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card b { display: block; font-size: 20px; }
  .card span { font-size: 12px; color: #666; }
  #chart { margin: 16px 24px; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  #tip { position: absolute; pointer-events: none; background: #222; color: #fff; padding: 6px 10px;
         border-radius: 4px; font-size: 12px; display: none; }
  .hint { margin: 0 24px 16px; font-size: 13px; color: #666; }
  button { margin-left: 24px; padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Time-Series Analytics Dashboard</h1>
  <p>Activity per day &mdash; scroll to zoom, drag to pan</p>
</header>
<div id="stats"></div>
<div id="chart"></div>
<button id="reset">Reset zoom</button>
<p class="hint">Data comes from gline.js, generated by time_series_engine.py</p>
<div id="tip"></div>
<script src="gline.js"></script>
<script>
const data = timeSeriesData.map(d => ({date: new Date(d.date + "T00:00:00"), label: d.date, count: d.count}));
const total = d3.sum(data, d => d.count);
const peak = d3.greatest(data, d => d.count);
const avg = total / data.length;

d3.select("#stats").html(
  `<div class="card"><b>${total.toLocaleString()}</b><span>Total records</span></div>
   <div class="card"><b>${data.length}</b><span>Daily data points</span></div>
   <div class="card"><b>${avg.toFixed(1)}</b><span>Average per day</span></div>
   <div class="card"><b>${peak.count.toLocaleString()}</b><span>Peak (${peak.label})</span></div>`);

const W = Math.min(window.innerWidth - 48, 1200), H = 460;
const m = {top: 20, right: 30, bottom: 40, left: 55};
const svg = d3.select("#chart").append("svg").attr("width", W).attr("height", H);

svg.append("defs").append("clipPath").attr("id", "clip").append("rect")
   .attr("x", m.left).attr("y", m.top)
   .attr("width", W - m.left - m.right).attr("height", H - m.top - m.bottom);

const x0 = d3.scaleTime().domain(d3.extent(data, d => d.date)).range([m.left, W - m.right]);
let x = x0;
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.count) * 1.1]).range([H - m.bottom, m.top]);

const gx = svg.append("g").attr("transform", `translate(0,${H - m.bottom})`);
svg.append("g").attr("transform", `translate(${m.left},0)`).call(d3.axisLeft(y));
svg.append("text").attr("transform", "rotate(-90)").attr("x", -H / 2).attr("y", 14)
   .attr("text-anchor", "middle").attr("font-size", 12).text("Entries per day");

const line = d3.line().x(d => x(d.date)).y(d => y(d.count));
const path = svg.append("path").attr("clip-path", "url(#clip)")
   .attr("fill", "none").attr("stroke", "#2a6fdb").attr("stroke-width", 1.6);

const peakDot = svg.append("circle").attr("r", 5).attr("fill", "#e03c31").attr("clip-path", "url(#clip)");
const focus = svg.append("circle").attr("r", 4).attr("fill", "#2a6fdb").style("display", "none");

function draw() {
  gx.call(d3.axisBottom(x).ticks(8));
  path.datum(data).attr("d", line);
  peakDot.attr("cx", x(peak.date)).attr("cy", y(peak.count));
}

const zoom = d3.zoom().scaleExtent([1, 30])
  .translateExtent([[m.left, 0], [W - m.right, H]]).extent([[m.left, 0], [W - m.right, H]])
  .on("zoom", e => { x = e.transform.rescaleX(x0); draw(); });

const bisect = d3.bisector(d => d.date).center;
const tip = d3.select("#tip");
svg.append("rect").attr("x", m.left).attr("y", m.top)
   .attr("width", W - m.left - m.right).attr("height", H - m.top - m.bottom)
   .attr("fill", "none").attr("pointer-events", "all").call(zoom)
   .on("mousemove", e => {
      const d = data[bisect(data, x.invert(d3.pointer(e)[0]))];
      focus.style("display", null).attr("cx", x(d.date)).attr("cy", y(d.count));
      tip.style("display", "block").style("left", (e.pageX + 12) + "px").style("top", (e.pageY - 28) + "px")
         .text(`${d.label}: ${d.count.toLocaleString()} entries`);
   })
   .on("mouseleave", () => { focus.style("display", "none"); tip.style("display", "none"); });

d3.select("#reset").on("click", () => svg.select("rect[pointer-events]").call(zoom.transform, d3.zoomIdentity));
draw();
</script>
</body>
</html>
